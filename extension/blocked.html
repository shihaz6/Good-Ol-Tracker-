<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus mode</title>
  <style>
    :root { --bg: #f7f6f2; --card: #ffffff; --ink: #1f1e1c; --muted: #6b6a66; --line: #e4e2dc; --accent: #2a6f5b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #a3a29c; --line: #34332f; --accent: #7cc4ad; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px;
      max-width: 440px; width: 100%; text-align: center; }
    .kicker { color: var(--accent); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; margin: 0; }
    h1 { font-size: 22px; margin: 8px 0 4px; word-break: break-word; }
    .left { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 18px 0 2px; }
    .muted { color: var(--muted); margin: 0; }
    .buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
    button, a.btn { font: inherit; padding: 10px 14px; border-radius: 9px; border: 1px solid var(--line);
      background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 600; }
    button.quiet { border: none; color: var(--muted); font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="kicker" id="kicker">Focus mode</p>
    <h1 id="site">This site is blocked</h1>
    <p class="muted" id="label"></p>
    <div class="left" id="left">--:--</div>
    <p class="muted" id="left-note">left in this focus session</p>
    <div class="buttons">
      <button class="primary" id="back" type="button">Back to work</button>
      <a class="btn" id="continue" hidden>Open the page</a>
      <button class="quiet" id="stop" type="button">End focus session early</button>
    </div>
    <p class="muted" id="msg" role="status"></p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
